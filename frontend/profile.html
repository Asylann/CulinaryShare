<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Your profile on CulinaryShare" />
    <title>My Profile - CulinaryShare</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <style>
      .profile-page {
        padding-top: 100px;
        min-height: 100vh;
      }

      .profile-header {
        background: var(--gradient-card);
        border: 1px solid var(--border-color);
        border-radius: var(--radius-xl);
        padding: var(--spacing-2xl);
        margin-bottom: var(--spacing-xl);
        display: flex;
        align-items: center;
        gap: var(--spacing-xl);
        position: relative;
        overflow: hidden;
      }

      .profile-header::before {
        content: "";
        position: absolute;
        top: -50%;
        right: -20%;
        width: 60%;
        height: 150%;
        background: radial-gradient(
          circle,
          rgba(255, 107, 53, 0.1) 0%,
          transparent 60%
        );
        pointer-events: none;
      }

      @media (max-width: 768px) {
        .profile-header {
          flex-direction: column;
          text-align: center;
        }
      }

      .profile-avatar {
        width: 140px;
        height: 140px;
        border-radius: 50%;
        background: var(--gradient-primary);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 4rem;
        font-weight: 700;
        flex-shrink: 0;
        box-shadow: var(--shadow-glow);
        position: relative;
        z-index: 1;
      }

      .profile-info {
        flex: 1;
        position: relative;
        z-index: 1;
      }

      .profile-name {
        font-size: 2rem;
        margin-bottom: var(--spacing-xs);
      }

      .profile-email {
        color: var(--text-muted);
        margin-bottom: var(--spacing-md);
      }

      .profile-badge {
        display: inline-flex;
        align-items: center;
        gap: var(--spacing-xs);
        padding: var(--spacing-xs) var(--spacing-md);
        background: rgba(255, 107, 53, 0.2);
        border: 1px solid rgba(255, 107, 53, 0.4);
        border-radius: var(--radius-full);
        font-size: 0.75rem;
        font-weight: 600;
        color: var(--primary-light);
        text-transform: uppercase;
      }

      .profile-stats {
        display: flex;
        gap: var(--spacing-xl);
        margin-top: var(--spacing-lg);
        padding-top: var(--spacing-lg);
        border-top: 1px solid var(--border-light);
      }

      .profile-stat {
        text-align: center;
      }

      .profile-stat-value {
        font-size: 1.75rem;
        font-weight: 700;
        color: var(--primary);
      }

      .profile-stat-label {
        font-size: 0.875rem;
        color: var(--text-muted);
      }

      .profile-actions {
        display: flex;
        gap: var(--spacing-md);
        position: relative;
        z-index: 1;
      }

      .tabs {
        display: flex;
        gap: var(--spacing-xs);
        background: var(--bg-card);
        padding: var(--spacing-xs);
        border-radius: var(--radius-lg);
        margin-bottom: var(--spacing-xl);
        border: 1px solid var(--border-color);
      }

      .tab {
        flex: 1;
        padding: var(--spacing-md) var(--spacing-lg);
        text-align: center;
        color: var(--text-secondary);
        border-radius: var(--radius-md);
        transition: all var(--transition-fast);
        cursor: pointer;
        font-weight: 500;
      }

      .tab:hover {
        color: var(--text-primary);
        background: var(--bg-elevated);
      }

      .tab.active {
        background: var(--primary);
        color: white;
      }

      .tab-content {
        display: none;
      }

      .tab-content.active {
        display: block;
      }

      .loading-container {
        display: flex;
        justify-content: center;
        padding: var(--spacing-3xl);
      }

      .no-recipes {
        text-align: center;
        padding: var(--spacing-3xl);
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: var(--radius-lg);
      }
    </style>
  </head>
  <body>
    <!-- Navigation -->
    <nav class="navbar" id="navbar">
      <div class="container">
        <a href="index.html" class="nav-brand">
          <span class="icon">CS</span>
          <span>CulinaryShare</span>
        </a>

        <div class="nav-links">
          <a href="index.html">Home</a>
          <a href="recipes.html">Recipes</a>
          <a href="categories.html">Categories</a>
        </div>

        <div class="nav-auth" id="nav-auth">
          <a href="create-recipe.html" class="btn btn-primary btn-sm">
            <span>+</span> New Recipe
          </a>
          <div class="nav-user" id="logout-btn" style="cursor: pointer">
            <div class="nav-user-avatar" id="nav-avatar">U</div>
            <span>Sign Out</span>
          </div>
        </div>
      </div>
    </nav>

    <main class="profile-page">
      <div class="container">
        <!-- Profile Header -->
        <div class="profile-header">
          <div class="profile-avatar" id="profile-avatar">U</div>
          <div class="profile-info">
            <h1 class="profile-name" id="profile-name">Loading...</h1>
            <p class="profile-email" id="profile-email">Loading...</p>
            <span class="profile-badge" id="profile-badge">
              <span></span>
              <span>User</span>
            </span>

            <div class="profile-stats">
              <div class="profile-stat">
                <div class="profile-stat-value" id="stat-recipes">0</div>
                <div class="profile-stat-label">Recipes</div>
              </div>
              <div class="profile-stat">
                <div class="profile-stat-value" id="stat-reviews">0</div>
                <div class="profile-stat-label">Reviews</div>
              </div>
              <div class="profile-stat">
                <div class="profile-stat-value" id="stat-rating">-</div>
                <div class="profile-stat-label">Avg Rating</div>
              </div>
            </div>
          </div>
          <div class="profile-actions">
            <a href="create-recipe.html" class="btn btn-primary">
              <span>+</span> New Recipe
            </a>
          </div>
        </div>

        <!-- Tabs -->
        <div class="tabs">
          <div class="tab active" data-tab="recipes">CS My Recipes</div>
          <div class="tab" data-tab="settings"> Settings</div>
        </div>

        <!-- Tab Content: My Recipes -->
        <div class="tab-content active" id="tab-recipes">
          <div class="recipe-grid" id="my-recipes">
            <div class="loading-container" style="grid-column: 1 / -1">
              <div class="spinner"></div>
            </div>
          </div>
        </div>

        <!-- Tab Content: Settings -->
        <div class="tab-content" id="tab-settings">
          <div
            class="form-section"
            style="
              max-width: 600px;
              background: var(--bg-card);
              border: 1px solid var(--border-color);
              border-radius: var(--radius-lg);
              padding: var(--spacing-xl);
            "
          >
            <h3 style="margin-bottom: var(--spacing-lg)">Account Settings</h3>

            <div class="form-group">
              <label class="form-label">Username</label>
              <input
                type="text"
                class="form-input"
                id="settings-username"
                disabled
              />
            </div>

            <div class="form-group">
              <label class="form-label">Email</label>
              <input
                type="email"
                class="form-input"
                id="settings-email"
                disabled
              />
            </div>

            <div class="form-group">
              <label class="form-label">Member Since</label>
              <input
                type="text"
                class="form-input"
                id="settings-joined"
                disabled
              />
            </div>

            <hr
              style="
                border: none;
                border-top: 1px solid var(--border-color);
                margin: var(--spacing-xl) 0;
              "
            />

            <h4 style="margin-bottom: var(--spacing-md); color: var(--error)">
              Danger Zone
            </h4>
            <button
              class="btn btn-secondary"
              id="logout-settings-btn"
              style="color: var(--error); border-color: var(--error)"
            >
               Sign Out
            </button>
          </div>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <div class="container">
        <div class="footer-bottom">
          <p>&copy; 2026 CulinaryShare. NoSQL Final Project.</p>
        </div>
      </div>
    </footer>

    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script>
      // Check authentication
      if (!TokenManager.isLoggedIn()) {
        window.location.href = "login.html";
      }

      // State
      let userRecipes = [];
      let categories = [];

      // DOM Elements
      const profileAvatar = document.getElementById("profile-avatar");
      const profileName = document.getElementById("profile-name");
      const profileEmail = document.getElementById("profile-email");
      const profileBadge = document.getElementById("profile-badge");
      const navAvatar = document.getElementById("nav-avatar");
      const myRecipes = document.getElementById("my-recipes");

      // Tab switching
      document.querySelectorAll(".tab").forEach((tab) => {
        tab.addEventListener("click", () => {
          document
            .querySelectorAll(".tab")
            .forEach((t) => t.classList.remove("active"));
          document
            .querySelectorAll(".tab-content")
            .forEach((c) => c.classList.remove("active"));

          tab.classList.add("active");
          document
            .getElementById(`tab-${tab.dataset.tab}`)
            .classList.add("active");
        });
      });

      // Logout handlers
      document.getElementById("logout-btn").addEventListener("click", () => {
        AuthAPI.logout();
      });

      document
        .getElementById("logout-settings-btn")
        .addEventListener("click", () => {
          AuthAPI.logout();
        });

      // Load user data
      async function loadUserData() {
        try {
          const response = await AuthAPI.getMe();
          const user = response.data;

          // Update profile
          profileAvatar.textContent = getInitials(user.username);
          navAvatar.textContent = getInitials(user.username);
          profileName.textContent = user.username;
          profileEmail.textContent = user.email;

          // Badge
          if (user.role === "ADMIN") {
            profileBadge.innerHTML = "<span></span><span>Admin</span>";
            profileBadge.style.background = "rgba(46, 196, 182, 0.2)";
            profileBadge.style.borderColor = "rgba(46, 196, 182, 0.4)";
            profileBadge.style.color = "var(--secondary)";
          }

          // Settings
          document.getElementById("settings-username").value = user.username;
          document.getElementById("settings-email").value = user.email;
          document.getElementById("settings-joined").value = formatDate(
            user.createdAt,
          );

          // Update stored user
          TokenManager.setUser(user);

          // Load user recipes
          loadUserRecipes(user.id);
        } catch (error) {
          console.error("Failed to load user data:", error);
          showNotification("Failed to load profile", "error");
        }
      }

      // Load categories
      async function loadCategories() {
        try {
          const response = await CategoriesAPI.getAll();
          categories = response.data || [];
        } catch (error) {
          console.error("Failed to load categories:", error);
        }
      }

      // Get category name
      function getCategoryName(categoryId) {
        const category = categories.find((c) => c.id === categoryId);
        return category ? category.name : "Recipe";
      }

      // Create recipe card
      function createRecipeCard(recipe) {
        return `
        <a href="recipe.html?id=${recipe.id}" class="card">
          <div class="card-image">
            <img src="${getRecipeImage(recipe)}" alt="${recipe.title}">
            <span class="card-badge">${getCategoryName(recipe.categoryId)}</span>
          </div>
          <div class="card-content">
            <h3 class="card-title">${recipe.title}</h3>
            <p style="color: var(--text-muted); font-size: 0.875rem; margin-bottom: var(--spacing-md); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">
              ${recipe.description || "No description."}
            </p>
            <div class="card-meta">
              <div class="card-rating">
                <span>${generateStars(recipe.averageRating || 0)}</span>
                <span>${(recipe.averageRating || 0).toFixed(1)}</span>
              </div>
              <span class="card-meta-item">
                 ${recipe.reviewCount || 0}
              </span>
            </div>
            <div class="card-footer">
              <span style="font-size: 0.75rem; color: var(--text-muted);">
                ${formatDate(recipe.createdAt)}
              </span>
              <a href="create-recipe.html?id=${recipe.id}" class="btn btn-sm btn-ghost">
                Edit Edit
              </a>
            </div>
          </div>
        </a>
      `;
      }

      // Load user recipes
      async function loadUserRecipes(userId) {
        try {
          const response = await RecipesAPI.getAll({ userId, limit: 50 });
          userRecipes = response.data?.recipes || response.data || [];

          // Update stats
          document.getElementById("stat-recipes").textContent =
            userRecipes.length;

          // Calculate total reviews and average rating
          let totalReviews = 0;
          let totalRating = 0;
          let ratedCount = 0;

          userRecipes.forEach((recipe) => {
            totalReviews += recipe.reviewCount || 0;
            if (recipe.averageRating > 0) {
              totalRating += recipe.averageRating;
              ratedCount++;
            }
          });

          document.getElementById("stat-reviews").textContent = totalReviews;
          document.getElementById("stat-rating").textContent =
            ratedCount > 0 ? (totalRating / ratedCount).toFixed(1) : "-";

          // Render recipes
          if (userRecipes.length > 0) {
            myRecipes.innerHTML = userRecipes.map(createRecipeCard).join("");
          } else {
            myRecipes.innerHTML = `
            <div class="no-recipes" style="grid-column: 1 / -1;">
              <div class="empty-state-icon" style="font-size: 4rem; margin-bottom: var(--spacing-lg);"></div>
              <h3>No recipes yet</h3>
              <p style="color: var(--text-muted); margin-bottom: var(--spacing-lg);">
                Share your first recipe with the community!
              </p>
              <a href="create-recipe.html" class="btn btn-primary">Create Recipe</a>
            </div>
          `;
          }
        } catch (error) {
          console.error("Failed to load recipes:", error);
          myRecipes.innerHTML = `
          <div class="no-recipes" style="grid-column: 1 / -1;">
            <p style="color: var(--text-muted);">Failed to load recipes.</p>
          </div>
        `;
        }
      }

      // Initialize
      document.addEventListener("DOMContentLoaded", async () => {
        await loadCategories();
        loadUserData();
      });
    </script>
  </body>
</html>
