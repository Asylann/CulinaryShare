<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Sign in to CulinaryShare to access your recipes and connect with food lovers."
    />
    <title>Sign In - CulinaryShare</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="auth-page">
      <div class="auth-card">
        <div class="auth-header">
          <a href="index.html" class="auth-logo">CS</a>
          <h1>Welcome Back</h1>
          <p>Sign in to continue to CulinaryShare</p>
        </div>

        <div id="error-alert" class="alert alert-error hidden">
          <span></span>
          <span id="error-message">Error message</span>
        </div>

        <form id="login-form">
          <div class="form-group">
            <label class="form-label" for="email">Email</label>
            <div class="form-input-icon">
              <span class="icon"></span>
              <input
                type="email"
                id="email"
                name="email"
                class="form-input"
                placeholder="Enter your email"
                required
                autocomplete="email"
              />
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <div class="form-input-icon">
              <span class="icon"></span>
              <input
                type="password"
                id="password"
                name="password"
                class="form-input"
                placeholder="Enter your password"
                required
                autocomplete="current-password"
              />
            </div>
          </div>

          <button
            type="submit"
            class="btn btn-primary btn-lg"
            style="width: 100%"
            id="submit-btn"
          >
            Sign In
          </button>
        </form>

        <div class="auth-footer">
          <p>Don't have an account? <a href="register.html">Create one</a></p>
        </div>
      </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script>
      // Redirect if already logged in
      if (TokenManager.isLoggedIn()) {
        window.location.href = "index.html";
      }

      const form = document.getElementById("login-form");
      const errorAlert = document.getElementById("error-alert");
      const errorMessage = document.getElementById("error-message");
      const submitBtn = document.getElementById("submit-btn");

      function showError(message) {
        errorMessage.textContent = message;
        errorAlert.classList.remove("hidden");
      }

      function hideError() {
        errorAlert.classList.add("hidden");
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        hideError();

        const formData = new FormData(form);
        const email = formData.get("email").trim();
        const password = formData.get("password");

        // Validate
        const errors = validateForm(
          { email, password },
          {
            email: { required: true, email: true, label: "Email" },
            password: { required: true, label: "Password" },
          },
        );

        if (Object.keys(errors).length > 0) {
          showFormErrors(errors);
          return;
        }

        // Submit
        setButtonLoading(submitBtn, true);

        try {
          await AuthAPI.login({ email, password });
          showNotification("Welcome back!", "success");

          // Redirect after short delay
          setTimeout(() => {
            window.location.href = "index.html";
          }, 500);
        } catch (error) {
          console.error("Login failed:", error);
          showError(
            error.message || "Invalid email or password. Please try again.",
          );
        } finally {
          setButtonLoading(submitBtn, false);
        }
      });
    </script>
  </body>
</html>
