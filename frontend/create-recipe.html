<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Create a new recipe on CulinaryShare" />
    <title>Create Recipe - CulinaryShare</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <style>
      .create-page {
        padding-top: 100px;
        min-height: 100vh;
      }

      .page-header {
        margin-bottom: var(--spacing-xl);
      }

      .create-form {
        max-width: 800px;
        margin: 0 auto;
      }

      .form-section {
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: var(--radius-lg);
        padding: var(--spacing-xl);
        margin-bottom: var(--spacing-lg);
      }

      .form-section-title {
        display: flex;
        align-items: center;
        gap: var(--spacing-sm);
        margin-bottom: var(--spacing-lg);
        padding-bottom: var(--spacing-md);
        border-bottom: 1px solid var(--border-light);
      }

      .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: var(--spacing-lg);
      }

      @media (max-width: 768px) {
        .form-row {
          grid-template-columns: 1fr;
        }
      }

      .ingredients-list {
        display: flex;
        flex-direction: column;
        gap: var(--spacing-md);
        margin-bottom: var(--spacing-md);
      }

      .ingredient-row {
        display: grid;
        grid-template-columns: 2fr 1fr 1fr auto;
        gap: var(--spacing-md);
        align-items: end;
      }

      @media (max-width: 768px) {
        .ingredient-row {
          grid-template-columns: 1fr;
        }
      }

      .remove-ingredient-btn {
        width: 40px;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg-elevated);
        border: 1px solid var(--border-color);
        border-radius: var(--radius-md);
        color: var(--error);
        cursor: pointer;
        transition: all var(--transition-fast);
      }

      .remove-ingredient-btn:hover {
        background: rgba(248, 81, 73, 0.15);
        border-color: var(--error);
      }

      .add-ingredient-btn {
        display: flex;
        align-items: center;
        gap: var(--spacing-sm);
        padding: var(--spacing-md);
        background: var(--bg-elevated);
        border: 1px dashed var(--border-color);
        border-radius: var(--radius-md);
        color: var(--text-secondary);
        cursor: pointer;
        transition: all var(--transition-fast);
        width: 100%;
        justify-content: center;
      }

      .add-ingredient-btn:hover {
        border-color: var(--primary);
        color: var(--primary);
      }

      .form-actions {
        display: flex;
        gap: var(--spacing-md);
        justify-content: flex-end;
      }

      .char-count {
        font-size: 0.75rem;
        color: var(--text-muted);
        text-align: right;
        margin-top: var(--spacing-xs);
      }
    </style>
  </head>
  <body>
    <!-- Navigation -->
    <nav class="navbar" id="navbar">
      <div class="container">
        <a href="index.html" class="nav-brand">
          <span class="icon">CS</span>
          <span>CulinaryShare</span>
        </a>

        <div class="nav-links">
          <a href="index.html">Home</a>
          <a href="recipes.html">Recipes</a>
          <a href="categories.html">Categories</a>
        </div>

        <div class="nav-auth" id="nav-auth">
          <a href="profile.html" class="nav-user">
            <div class="nav-user-avatar" id="user-avatar">U</div>
            <span id="user-name">User</span>
          </a>
        </div>
      </div>
    </nav>

    <main class="create-page">
      <div class="container">
        <div class="page-header">
          <h1 id="page-title">Create New Recipe</h1>
          <p class="text-muted">Share your culinary creation with the world</p>
        </div>

        <form class="create-form" id="recipe-form">
          <!-- Basic Info -->
          <div class="form-section">
            <h3 class="form-section-title"> Basic Information</h3>

            <div class="form-group">
              <label class="form-label" for="title">Recipe Title *</label>
              <input
                type="text"
                id="title"
                name="title"
                class="form-input"
                placeholder="e.g., Grandmother's Apple Pie"
                required
                maxlength="100"
              />
              <p class="char-count"><span id="title-count">0</span>/100</p>
            </div>

            <div class="form-group">
              <label class="form-label" for="description">Description *</label>
              <textarea
                id="description"
                name="description"
                class="form-input"
                placeholder="Describe your recipe..."
                required
                rows="3"
                maxlength="500"
              ></textarea>
              <p class="char-count"><span id="desc-count">0</span>/500</p>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label class="form-label" for="categoryId">Category *</label>
                <select
                  id="categoryId"
                  name="categoryId"
                  class="form-input"
                  required
                >
                  <option value="">Select a category</option>
                </select>
              </div>

              <div class="form-group">
                <label class="form-label" for="servings">Servings *</label>
                <input
                  type="number"
                  id="servings"
                  name="servings"
                  class="form-input"
                  placeholder="4"
                  required
                  min="1"
                  max="100"
                />
              </div>
            </div>

            <div class="form-group">
              <label class="form-label" for="cookingTime"
                >Cooking Time (minutes) *</label
              >
              <input
                type="number"
                id="cookingTime"
                name="cookingTime"
                class="form-input"
                placeholder="30"
                required
                min="1"
                max="1440"
              />
            </div>
          </div>

          <!-- Ingredients -->
          <div class="form-section">
            <h3 class="form-section-title"> Ingredients</h3>

            <div class="ingredients-list" id="ingredients-list">
              <!-- Ingredient rows will be added here -->
            </div>

            <button
              type="button"
              class="add-ingredient-btn"
              id="add-ingredient-btn"
            >
              <span>+</span> Add Ingredient
            </button>
          </div>

          <!-- Instructions -->
          <div class="form-section">
            <h3 class="form-section-title">‍CS Instructions</h3>

            <div class="form-group">
              <label class="form-label" for="instructions"
                >Step by step instructions *</label
              >
              <textarea
                id="instructions"
                name="instructions"
                class="form-input"
                placeholder="1. Preheat the oven to 180°C...
2. Mix the ingredients...
3. Bake for 30 minutes..."
                required
                rows="8"
              ></textarea>
            </div>
          </div>

          <!-- Form Actions -->
          <div class="form-actions">
            <a href="javascript:history.back()" class="btn btn-secondary"
              >Cancel</a
            >
            <button
              type="submit"
              class="btn btn-primary btn-lg"
              id="submit-btn"
            >
              Create Recipe
            </button>
          </div>
        </form>
      </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <div class="container">
        <div class="footer-bottom">
          <p>&copy; 2026 CulinaryShare. NoSQL Final Project.</p>
        </div>
      </div>
    </footer>

    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script>
      // Check authentication
      if (!TokenManager.isLoggedIn()) {
        window.location.href = "login.html";
      }

      // State
      let isEditing = false;
      let recipeId = null;
      let categories = [];

      // DOM Elements
      const form = document.getElementById("recipe-form");
      const ingredientsList = document.getElementById("ingredients-list");
      const addIngredientBtn = document.getElementById("add-ingredient-btn");
      const submitBtn = document.getElementById("submit-btn");
      const pageTitle = document.getElementById("page-title");
      const userAvatar = document.getElementById("user-avatar");
      const userName = document.getElementById("user-name");
      const titleInput = document.getElementById("title");
      const descInput = document.getElementById("description");

      // Update user info
      function updateUserInfo() {
        const user = TokenManager.getUser();
        if (user) {
          userAvatar.textContent = getInitials(user.username);
          userName.textContent = user.username;
        }
      }

      // Character count
      titleInput.addEventListener("input", () => {
        document.getElementById("title-count").textContent =
          titleInput.value.length;
      });

      descInput.addEventListener("input", () => {
        document.getElementById("desc-count").textContent =
          descInput.value.length;
      });

      // Check if editing
      function checkEditMode() {
        const params = getUrlParams();
        if (params.id) {
          isEditing = true;
          recipeId = params.id;
          pageTitle.textContent = "Edit Recipe";
          submitBtn.textContent = "Update Recipe";
          document.title = "Edit Recipe - CulinaryShare";
          loadRecipe();
        } else {
          // Add initial ingredient row
          addIngredientRow();
        }
      }

      // Load categories
      async function loadCategories() {
        try {
          const response = await CategoriesAPI.getAll();
          categories = response.data || [];

          const select = document.getElementById("categoryId");
          categories.forEach((cat) => {
            const option = document.createElement("option");
            option.value = cat.id;
            option.textContent = cat.name;
            select.appendChild(option);
          });
        } catch (error) {
          console.error("Failed to load categories:", error);
          showNotification("Failed to load categories", "error");
        }
      }

      // Load recipe for editing
      async function loadRecipe() {
        try {
          const response = await RecipesAPI.getById(recipeId);
          const recipe = response.data;

          if (!recipe) {
            showNotification("Recipe not found", "error");
            window.location.href = "recipes.html";
            return;
          }

          // Check ownership
          const user = TokenManager.getUser();
          if (recipe.userId !== user.id && user.role !== "ADMIN") {
            showNotification("You cannot edit this recipe", "error");
            window.location.href = `recipe.html?id=${recipeId}`;
            return;
          }

          // Fill form
          document.getElementById("title").value = recipe.title;
          document.getElementById("description").value = recipe.description;
          document.getElementById("categoryId").value = recipe.categoryId;
          document.getElementById("servings").value = recipe.servings;
          document.getElementById("cookingTime").value = recipe.cookingTime;
          document.getElementById("instructions").value = recipe.instructions;

          // Update char counts
          document.getElementById("title-count").textContent =
            recipe.title?.length || 0;
          document.getElementById("desc-count").textContent =
            recipe.description?.length || 0;

          // Add ingredients
          ingredientsList.innerHTML = "";
          if (recipe.ingredients && recipe.ingredients.length > 0) {
            recipe.ingredients.forEach((ing) => addIngredientRow(ing));
          } else {
            addIngredientRow();
          }
        } catch (error) {
          console.error("Failed to load recipe:", error);
          showNotification("Failed to load recipe", "error");
        }
      }

      // Add ingredient row
      function addIngredientRow(ingredient = null) {
        const row = document.createElement("div");
        row.className = "ingredient-row";
        row.innerHTML = `
        <div class="form-group" style="margin-bottom: 0;">
          <label class="form-label">Name</label>
          <input 
            type="text" 
            class="form-input ingredient-name" 
            placeholder="e.g., Flour"
            value="${ingredient?.name || ""}"
          >
        </div>
        <div class="form-group" style="margin-bottom: 0;">
          <label class="form-label">Quantity</label>
          <input 
            type="text" 
            class="form-input ingredient-quantity" 
            placeholder="e.g., 200"
            value="${ingredient?.quantity || ""}"
          >
        </div>
        <div class="form-group" style="margin-bottom: 0;">
          <label class="form-label">Unit</label>
          <input 
            type="text" 
            class="form-input ingredient-unit" 
            placeholder="e.g., g"
            value="${ingredient?.unit || ""}"
          >
        </div>
        <button type="button" class="remove-ingredient-btn" title="Remove">
          x
        </button>
      `;

        // Remove button handler
        row
          .querySelector(".remove-ingredient-btn")
          .addEventListener("click", () => {
            if (ingredientsList.children.length > 1) {
              row.remove();
            } else {
              showNotification(
                "At least one ingredient is required",
                "warning",
              );
            }
          });

        ingredientsList.appendChild(row);
      }

      // Add ingredient button
      addIngredientBtn.addEventListener("click", () => {
        addIngredientRow();
      });

      // Get ingredients from form
      function getIngredients() {
        const rows = ingredientsList.querySelectorAll(".ingredient-row");
        const ingredients = [];

        rows.forEach((row) => {
          const name = row.querySelector(".ingredient-name").value.trim();
          const quantity = row
            .querySelector(".ingredient-quantity")
            .value.trim();
          const unit = row.querySelector(".ingredient-unit").value.trim();

          if (name) {
            ingredients.push({ name, quantity, unit });
          }
        });

        return ingredients;
      }

      // Form submission
      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const ingredients = getIngredients();

        if (ingredients.length === 0) {
          showNotification("Please add at least one ingredient", "error");
          return;
        }

        const recipeData = {
          title: document.getElementById("title").value.trim(),
          description: document.getElementById("description").value.trim(),
          categoryId: document.getElementById("categoryId").value,
          servings: parseInt(document.getElementById("servings").value),
          cookingTime: parseInt(document.getElementById("cookingTime").value),
          instructions: document.getElementById("instructions").value.trim(),
          ingredients,
        };

        // Validate
        if (
          !recipeData.title ||
          !recipeData.description ||
          !recipeData.categoryId ||
          !recipeData.instructions ||
          !recipeData.servings ||
          !recipeData.cookingTime
        ) {
          showNotification("Please fill in all required fields", "error");
          return;
        }

        setButtonLoading(submitBtn, true);

        try {
          let response;
          if (isEditing) {
            response = await RecipesAPI.update(recipeId, recipeData);
            showNotification("Recipe updated successfully!", "success");
          } else {
            response = await RecipesAPI.create(recipeData);
            showNotification("Recipe created successfully!", "success");
          }

          const newRecipeId = response.data?.id || recipeId;

          setTimeout(() => {
            window.location.href = `recipe.html?id=${newRecipeId}`;
          }, 1000);
        } catch (error) {
          console.error("Failed to save recipe:", error);
          showNotification(error.message || "Failed to save recipe", "error");
        } finally {
          setButtonLoading(submitBtn, false);
        }
      });

      // Initialize
      document.addEventListener("DOMContentLoaded", async () => {
        updateUserInfo();
        await loadCategories();
        checkEditMode();
      });
    </script>
  </body>
</html>
