<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Create your CulinaryShare account and start sharing your favorite recipes."
    />
    <title>Sign Up - CulinaryShare</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="auth-page">
      <div class="auth-card">
        <div class="auth-header">
          <a href="index.html" class="auth-logo">CS</a>
          <h1>Create Account</h1>
          <p>Join our community of food lovers</p>
        </div>

        <div id="error-alert" class="alert alert-error hidden">
          <span></span>
          <span id="error-message">Error message</span>
        </div>

        <div id="success-alert" class="alert alert-success hidden">
          <span></span>
          <span>Account created successfully! Redirecting...</span>
        </div>

        <form id="register-form">
          <div class="form-group">
            <label class="form-label" for="username">Username</label>
            <div class="form-input-icon">
              <span class="icon"></span>
              <input
                type="text"
                id="username"
                name="username"
                class="form-input"
                placeholder="Choose a username"
                required
                autocomplete="username"
              />
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="email">Email</label>
            <div class="form-input-icon">
              <span class="icon"></span>
              <input
                type="email"
                id="email"
                name="email"
                class="form-input"
                placeholder="Enter your email"
                required
                autocomplete="email"
              />
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <div class="form-input-icon">
              <span class="icon"></span>
              <input
                type="password"
                id="password"
                name="password"
                class="form-input"
                placeholder="Create a password (min 6 characters)"
                required
                minlength="6"
                autocomplete="new-password"
              />
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="confirmPassword"
              >Confirm Password</label
            >
            <div class="form-input-icon">
              <span class="icon"></span>
              <input
                type="password"
                id="confirmPassword"
                name="confirmPassword"
                class="form-input"
                placeholder="Confirm your password"
                required
                autocomplete="new-password"
              />
            </div>
          </div>

          <button
            type="submit"
            class="btn btn-primary btn-lg"
            style="width: 100%"
            id="submit-btn"
          >
            Create Account
          </button>
        </form>

        <div class="auth-footer">
          <p>Already have an account? <a href="login.html">Sign in</a></p>
        </div>
      </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script>
      // Redirect if already logged in
      if (TokenManager.isLoggedIn()) {
        window.location.href = "index.html";
      }

      const form = document.getElementById("register-form");
      const errorAlert = document.getElementById("error-alert");
      const errorMessage = document.getElementById("error-message");
      const successAlert = document.getElementById("success-alert");
      const submitBtn = document.getElementById("submit-btn");

      function showError(message) {
        errorMessage.textContent = message;
        errorAlert.classList.remove("hidden");
        successAlert.classList.add("hidden");
      }

      function showSuccess() {
        successAlert.classList.remove("hidden");
        errorAlert.classList.add("hidden");
      }

      function hideAlerts() {
        errorAlert.classList.add("hidden");
        successAlert.classList.add("hidden");
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        hideAlerts();

        const formData = new FormData(form);
        const username = formData.get("username").trim();
        const email = formData.get("email").trim();
        const password = formData.get("password");
        const confirmPassword = formData.get("confirmPassword");

        // Validate
        const errors = validateForm(
          { username, email, password, confirmPassword },
          {
            username: { required: true, minLength: 3, label: "Username" },
            email: { required: true, email: true, label: "Email" },
            password: { required: true, minLength: 6, label: "Password" },
            confirmPassword: {
              required: true,
              match: "password",
              label: "Confirm Password",
            },
          },
        );

        if (Object.keys(errors).length > 0) {
          showFormErrors(errors);
          return;
        }

        // Submit
        setButtonLoading(submitBtn, true);

        try {
          await AuthAPI.register({ username, email, password });
          showSuccess();

          // Redirect after short delay
          setTimeout(() => {
            window.location.href = "index.html";
          }, 1500);
        } catch (error) {
          console.error("Registration failed:", error);
          let message = "Registration failed. Please try again.";

          if (error.message) {
            if (error.message.includes("email")) {
              message = "This email is already registered.";
            } else if (error.message.includes("username")) {
              message = "This username is already taken.";
            } else {
              message = error.message;
            }
          }

          showError(message);
        } finally {
          setButtonLoading(submitBtn, false);
        }
      });
    </script>
  </body>
</html>
